<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>EMO AR · Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Gantari:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    html, body { margin: 0; padding: 0; background: #1F1A1F; font-family: 'Gantari', system-ui; color: #FAF6F1; overflow: hidden; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }

    @keyframes mascot-bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
    .mascot-bob { animation: mascot-bob 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes mascot-pop { 0% { transform: scale(0.2) translateY(30px); opacity: 0; } 60% { transform: scale(1.08) translateY(-4px); opacity: 1; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes mascot-appear { 0% { transform: translateX(-50%) scale(0.3) translateY(40px); opacity: 0; } 60% { transform: translateX(-50%) scale(1.08) translateY(-6px); opacity: 1; } 100% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; } }
    @keyframes scan-sweep { 0% { top: 0%; opacity: 0; } 8%,92% { opacity: 1; } 50% { top: 100%; } 100% { top: 0%; opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
    @keyframes twinkle { 0%,100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(180deg); } }
    @keyframes loading-bar-fill { 0% { transform: translateX(-100%); } 100% { transform: translateX(0%); } }
    @keyframes loading-bar-shimmer { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    @keyframes icon-slide-out { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(140px); opacity: 0; } }
    @keyframes mascot-settle { 0% { transform: scale(1.035); } 100% { transform: scale(1); } }
    @keyframes glow-pulse { 0%,100% { opacity: 0.55; transform: translateX(-50%) scale(1); } 50% { opacity: 0.85; transform: translateX(-50%) scale(1.08); } }
    .sprout-sprite { animation: sprout-grow 3.8s steps(23, end) infinite; }
    @keyframes sprout-grow { 0% { background-position-x: 0; } 55% { background-position-x: var(--frameShift); } 100% { background-position-x: var(--frameShift); } }
    @keyframes sprout-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .sprout-sprite-wrap { animation: sprout-bob 3.2s ease-in-out infinite; }
    @keyframes face-bob { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-10px) rotate(1.5deg); } }

    /* screen transitions */
    .screen-container { position: absolute; inset: 0; }
    .screen-enter { animation: screenFade 360ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes screenFade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <!-- A-Frame + MindAR image tracking runtime (CDN, no local build). -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="mascot.jsx"></script>
  <script type="text/babel" src="screens-a.jsx"></script>
  <script type="text/babel" src="screens-b.jsx?v=frozen-edit-20260427"></script>

  <script type="text/babel">
    const FRAME_W = 390;
    const FRAME_H = 820;

    // Flow definition: each state maps to a screen component + ordered list of click hotspots.
    // Hotspots are positioned over the rendered iOS frame (which is FRAME_W x FRAME_H).
    // Coordinates are in the coordinate system of the screen (0..FRAME_W horizontally).
    // A hotspot with `action: 'go'` navigates to another state.
    const STATES = [
      { key: 'landing',    label: '01 Landing',   desc: 'Landing' },
      { key: 'permission', label: '02 Permission',desc: 'Permission' },
      { key: 'loading',    label: '03 Loading',   desc: 'Loading (auto → scan)' },
      { key: 'scan',       label: '04 Scan',      desc: 'Scanning' },
      { key: 'ar',         label: '05 AR',        desc: 'AR active' },
      { key: 'denied',     label: '06 Denied',    desc: 'Denied' },
      { key: 'error',      label: '07 Error',     desc: 'Error' },
    ];

    // Hotspots per screen. Each one: { id, top, left, width, height, go, label }.
    // Positions target buttons visible in the existing screen components.
    const HOTSPOTS = {
      landing: [],
      permission: [],
      loading: [
        // No hotspots — auto-advances after 2.2s
      ],
      scan: [],
      ar: [],
      denied: [],
      error: [],
    };

    // Keep this list in the same order used when compiling assets/mindar/targets.mind.
    // The current .mind file contains 6 image targets.
    const DEFAULT_ANCHORED_AR = {
      type: 'model',
      assetId: 'emo-model',
      position: '0 0 0.08',
      rotation: '0 0 0',
      scale: '0.18 0.18 0.18',
      floatTo: '0 0 0.13',
    };

    const MINDAR_TARGETS = [
      { targetIndex: 0, targetId: 'emo-scene-airmodel-01', label: 'EMO installation photo 01', ar: { ...DEFAULT_ANCHORED_AR } },
      { targetIndex: 1, targetId: 'emo-scene-airmodel-02', label: 'EMO installation photo 02', ar: { ...DEFAULT_ANCHORED_AR } },
      { targetIndex: 2, targetId: 'emo-pillow', label: 'EMO pillow product', ar: { ...DEFAULT_ANCHORED_AR } },
      { targetIndex: 3, targetId: 'emo-plush-charm-01', label: 'EMO plush charm 01', ar: { ...DEFAULT_ANCHORED_AR } },
      { targetIndex: 4, targetId: 'emo-plush-charm-02', label: 'EMO plush charm 02', ar: { ...DEFAULT_ANCHORED_AR } },
      { targetIndex: 5, targetId: 'emo-front', label: 'EMO front poster', ar: { ...DEFAULT_ANCHORED_AR } },
    ];

    const AFRAME_ASSETS = [
      { id: 'emo-model', type: 'model', src: 'assets/step06/models/yimao-sitting.glb' },
    ];

    const escapeAttr = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    const findSceneAssetById = (scene, id) => {
      if (!scene || !id) return null;
      return Array.from(scene.querySelectorAll('[id]')).find((node) => node.id === id) || null;
    };

    const cloneTarget = (target) => ({
      ...target,
      ar: target.ar ? { ...target.ar } : undefined,
    });

    function buildAFrameAssetsMarkup() {
      return AFRAME_ASSETS.map((asset) => {
        const id = escapeAttr(asset.id);
        const src = escapeAttr(asset.src);
        if (asset.type === 'model') {
          return `<a-asset-item id="${id}" src="${src}"></a-asset-item>`;
        }
        if (asset.type === 'video') {
          return `<video id="${id}" src="${src}" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>`;
        }
        return `<img id="${id}" src="${src}" crossorigin="anonymous">`;
      }).join('');
    }

    function buildAnchoredContentMarkup(target) {
      const ar = target.ar || DEFAULT_ANCHORED_AR;
      const targetId = escapeAttr(target.targetId);
      const label = escapeAttr(target.label);
      const position = escapeAttr(ar.position || DEFAULT_ANCHORED_AR.position);
      const rotation = escapeAttr(ar.rotation || DEFAULT_ANCHORED_AR.rotation);
      const scale = escapeAttr(ar.scale || DEFAULT_ANCHORED_AR.scale);
      const floatTo = escapeAttr(ar.floatTo || DEFAULT_ANCHORED_AR.floatTo);
      const assetId = escapeAttr(ar.assetId || DEFAULT_ANCHORED_AR.assetId);

      if (ar.type === 'video') {
        const width = escapeAttr(ar.width || '1');
        const height = escapeAttr(ar.height || '0.6');
        return `
          <a-entity class="anchored-content" data-target-id="${targetId}" data-label="${label}">
            <a-plane
              width="${width}"
              height="${height}"
              position="${position}"
              rotation="${rotation}"
              material="shader: flat; src: #${assetId}; transparent: true">
            </a-plane>
          </a-entity>
        `;
      }

      if (ar.type === 'image') {
        const width = escapeAttr(ar.width || '0.7');
        const height = escapeAttr(ar.height || '0.7');
        return `
          <a-entity class="anchored-content" data-target-id="${targetId}" data-label="${label}">
            <a-plane
              width="${width}"
              height="${height}"
              position="${position}"
              rotation="${rotation}"
              material="shader: flat; src: #${assetId}; transparent: true">
            </a-plane>
          </a-entity>
        `;
      }

      return `
        <a-entity class="anchored-content" data-target-id="${targetId}" data-label="${label}">
          <a-gltf-model
            src="#${assetId}"
            position="${position}"
            rotation="${rotation}"
            scale="${scale}"
            animation__float="property: position; dir: alternate; dur: 1800; easing: easeInOutSine; loop: true; to: ${floatTo}"
            animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 7600; easing: linear">
          </a-gltf-model>
        </a-entity>
      `;
    }

    function buildFrozenContentMarkup() {
      const assetId = escapeAttr(DEFAULT_ANCHORED_AR.assetId);
      const scale = escapeAttr(DEFAULT_ANCHORED_AR.scale);
      return `
        <a-entity id="frozen-ar-object" visible="false">
          <a-gltf-model
            id="frozen-ar-model"
            src="#${assetId}"
            position="0 0 0"
            rotation="0 0 0"
            scale="${scale}">
          </a-gltf-model>
        </a-entity>
      `;
    }

    // Placeholder contract for the future browser-local EMO classifier.
    // MindAR remains authoritative for known physical targets; this detector
    // can later report open-scene EMO presence without controlling AR anchors.
    function createEmoDetectorStub() {
      const resultCbs = new Set();
      let running = false;
      return {
        start: async ({ source = null, intervalMs = 500 } = {}) => {
          running = true;
          return { running, source, intervalMs };
        },
        stop: () => {
          running = false;
        },
        onResult: (cb) => {
          resultCbs.add(cb);
          return () => resultCbs.delete(cb);
        },
        getStatus: () => running ? 'running' : 'idle',
        emitMockResult: (result = {}) => {
          const payload = {
            present: false,
            confidence: 0,
            source: 'local-ai',
            ...result,
          };
          resultCbs.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
          return payload;
        },
      };
    }

    if (!window.__emoDetector) {
      window.__emoDetector = createEmoDetectorStub();
    }

    // ─── MindAR shared runtime ────────────────────────────────
    // A single <a-scene> lives under the phone frame for the whole session.
    // It powers both the "scan" and "ar" screens — we never restart the
    // camera on scan↔ar transitions, which would be jarring.
    //
    // window.__mindar exposes:
    //   start() / stop()                  — camera + tracking lifecycle
    //   getStatus() / onStatus(cb)        — idle/loading/ready/running/found/lost/error
    //   onTargetFound(cb) / onTargetLost  — optional 2D target subscribers, receives target metadata
    //   getActiveTargets() / getLastTarget() — current and most recent target metadata
    //   freezeCurrentTarget() / unfreezeCurrentTarget() — enter/exit editable captured AR mode
    //   setFrozenTransform(transform) / getFrozenState() — update/read editable captured AR transform
    //   focusCamera()                     — best-effort focus kick for mobile cameras
    //   isReady()                         — true once a-scene has loaded
    function MindARStage({ active, visible }) {
      const containerRef = React.useRef(null);
      const sceneRef = React.useRef(null);
      const anchorsRef = React.useRef([]);
      const startedRef = React.useRef(false);
      const statusRef = React.useRef('idle');

      // Mount the <a-scene> exactly once on mount.
      React.useEffect(() => {
        const container = containerRef.current;
        if (!container || sceneRef.current) return;

        // Build the scene via innerHTML so React never diffs A-Frame's DOM.
        const anchorMarkup = MINDAR_TARGETS.map((target) => (
          `<a-entity mindar-image-target="targetIndex: ${target.targetIndex}" id="emo-anchor-${target.targetIndex}">
            ${buildAnchoredContentMarkup(target)}
          </a-entity>`
        )).join('');
        const assetsMarkup = buildAFrameAssetsMarkup();

        container.innerHTML = `
          <a-scene embedded
            mindar-image="imageTargetSrc: assets/mindar/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            renderer="colorManagement: true; physicallyCorrectLights: true"
            style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none;">
            <a-assets timeout="10000">${assetsMarkup}</a-assets>
            <a-entity light="type: ambient; color: #ffffff; intensity: 0.95"></a-entity>
            <a-entity light="type: directional; color: #ffffff; intensity: 0.65" position="1 2 1"></a-entity>
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            ${anchorMarkup}
            ${buildFrozenContentMarkup()}
          </a-scene>
        `;

        const scene = container.querySelector('a-scene');
        const camera = container.querySelector('a-camera');
        const frozenObject = container.querySelector('#frozen-ar-object');
        const frozenModel = container.querySelector('#frozen-ar-model');
        const anchors = MINDAR_TARGETS.map((target) => ({
          target,
          element: container.querySelector(`#emo-anchor-${target.targetIndex}`),
          onFound: null,
          onLost: null,
        })).filter(({ element }) => element);
        sceneRef.current = scene;
        anchorsRef.current = anchors;

        const foundCbs = new Set();
        const lostCbs = new Set();
        const statusCbs = new Set();
        const activeTargets = new Map();
        let lastTarget = null;
        const frozenState = {
          active: false,
          sourceTarget: null,
          position: { x: 0, y: 0, z: -1.1 },
          rotation: { x: 0, y: 0, z: 0 },
          scale: { x: 0.18, y: 0.18, z: 0.18 },
        };

        const setStatus = (nextStatus) => {
          statusRef.current = nextStatus;
          statusCbs.forEach(cb => { try { cb(nextStatus); } catch (e) { console.error(e); } });
        };

        const parseVector = (value, fallback) => {
          if (value && typeof value === 'object') {
            return {
              x: Number.isFinite(Number(value.x)) ? Number(value.x) : fallback.x,
              y: Number.isFinite(Number(value.y)) ? Number(value.y) : fallback.y,
              z: Number.isFinite(Number(value.z)) ? Number(value.z) : fallback.z,
            };
          }
          const parts = String(value || '').trim().split(/\s+/).map(Number);
          return {
            x: Number.isFinite(parts[0]) ? parts[0] : fallback.x,
            y: Number.isFinite(parts[1]) ? parts[1] : fallback.y,
            z: Number.isFinite(parts[2]) ? parts[2] : fallback.z,
          };
        };

        const finiteNumber = (value, fallback = 0) => (
          Number.isFinite(Number(value)) ? Number(value) : fallback
        );

        const cloneFrozenState = () => ({
          active: frozenState.active,
          sourceTarget: frozenState.sourceTarget ? cloneTarget(frozenState.sourceTarget) : null,
          position: { ...frozenState.position },
          rotation: { ...frozenState.rotation },
          scale: { ...frozenState.scale },
        });

        const applyFrozenState = () => {
          if (!frozenObject?.object3D || !frozenModel?.object3D) return false;
          frozenObject.object3D.position.set(
            frozenState.position.x,
            frozenState.position.y,
            frozenState.position.z
          );
          frozenObject.object3D.rotation.set(
            THREE.MathUtils.degToRad(frozenState.rotation.x),
            THREE.MathUtils.degToRad(frozenState.rotation.y),
            THREE.MathUtils.degToRad(frozenState.rotation.z)
          );
          frozenModel.object3D.scale.set(
            frozenState.scale.x,
            frozenState.scale.y,
            frozenState.scale.z
          );
          frozenObject.setAttribute('visible', frozenState.active ? 'true' : 'false');
          return true;
        };

        const setLiveContentVisible = (visibleLive) => {
          anchors.forEach((anchor) => {
            anchor.element.querySelectorAll('.anchored-content').forEach((node) => {
              node.setAttribute('visible', visibleLive ? 'true' : 'false');
            });
          });
        };

        const findSourceContent = (target) => {
          const source = target || lastTarget || activeTargets.values().next().value || MINDAR_TARGETS[0];
          const anchor = anchors.find((item) => item.target.targetIndex === source?.targetIndex);
          return anchor?.element?.querySelector('.anchored-content') || anchor?.element || null;
        };

        // Live yaw — manual rotation applied to anchored GLBs in final-live mode.
        // Auto-spin is removed on first manual rotation so the user takes over.
        let liveYawOffset = 0;
        const liveAnimatedNodes = [];
        const collectLiveAnimatedNodes = () => {
          liveAnimatedNodes.length = 0;
          anchors.forEach(({ element }) => {
            const node = element?.querySelector?.('a-gltf-model, a-plane');
            if (node) liveAnimatedNodes.push(node);
          });
        };
        const applyLiveYaw = () => {
          liveAnimatedNodes.forEach((node) => {
            node.setAttribute('rotation', `0 ${liveYawOffset} 0`);
            if (node.object3D) {
              node.object3D.rotation.y = THREE.MathUtils.degToRad(liveYawOffset);
            }
          });
        };
        const stopLiveSpin = () => {
          liveAnimatedNodes.forEach((node) => {
            if (node.hasAttribute('animation__spin')) node.removeAttribute('animation__spin');
          });
        };
        const rotateLiveBy = ({ yawDelta = 0 } = {}) => {
          if (!liveAnimatedNodes.length) collectLiveAnimatedNodes();
          stopLiveSpin();
          liveYawOffset = ((liveYawOffset + Number(yawDelta || 0)) % 360 + 360) % 360;
          applyLiveYaw();
          return { yaw: liveYawOffset, targetsActive: activeTargets.size };
        };
        const getLiveYaw = () => liveYawOffset;

        const freezeCurrentTarget = () => {
          if (!frozenObject || !frozenModel) return null;

          // Position the frozen GLB directly in front of the camera at freeze
          // time — guarantees visibility regardless of whether MindAR currently
          // has a target locked. The user can then drag/twist to recompose.
          const cameraObj = camera?.object3D;
          const camPos = new THREE.Vector3();
          const camQuat = new THREE.Quaternion();
          if (cameraObj) {
            cameraObj.updateWorldMatrix(true, false);
            cameraObj.getWorldPosition(camPos);
            cameraObj.getWorldQuaternion(camQuat);
          } else {
            camQuat.identity();
          }
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
          const targetPos = camPos.clone().add(forward.multiplyScalar(1.1));

          const sourceTarget = lastTarget || activeTargets.values().next().value || MINDAR_TARGETS[0];
          const fallbackScale = parseVector(sourceTarget?.ar?.scale || DEFAULT_ANCHORED_AR.scale, frozenState.scale);

          frozenState.active = true;
          frozenState.sourceTarget = sourceTarget ? cloneTarget(sourceTarget) : null;
          frozenState.position = {
            x: Number.isFinite(targetPos.x) ? targetPos.x : 0,
            y: Number.isFinite(targetPos.y) ? targetPos.y : 0,
            z: Number.isFinite(targetPos.z) ? targetPos.z : -1.1,
          };
          frozenState.rotation = { x: 0, y: liveYawOffset, z: 0 };
          frozenState.scale = {
            x: fallbackScale.x > 0 ? fallbackScale.x : frozenState.scale.x,
            y: fallbackScale.y > 0 ? fallbackScale.y : frozenState.scale.y,
            z: fallbackScale.z > 0 ? fallbackScale.z : frozenState.scale.z,
          };
          setLiveContentVisible(false);
          applyFrozenState();
          return cloneFrozenState();
        };

        const unfreezeCurrentTarget = () => {
          frozenState.active = false;
          frozenState.sourceTarget = null;
          setLiveContentVisible(true);
          applyFrozenState();
          return cloneFrozenState();
        };

        const setFrozenTransform = (transform = {}) => {
          if (!frozenState.active) return cloneFrozenState();
          if (transform.position) {
            frozenState.position = parseVector(transform.position, frozenState.position);
          }
          if (transform.rotation) {
            frozenState.rotation = parseVector(transform.rotation, frozenState.rotation);
          }
          if (transform.scale) {
            frozenState.scale = parseVector(transform.scale, frozenState.scale);
          }
          applyFrozenState();
          return cloneFrozenState();
        };

        const moveFrozenByScreenDelta = ({ dx = 0, dy = 0, pixelsPerWorldUnit } = {}) => {
          if (!pixelsPerWorldUnit) {
            const vw = window.innerWidth || 390;
            pixelsPerWorldUnit = Math.max(360, vw * 1.1);
          }
          if (!frozenState.active) return cloneFrozenState();
          const cameraObject = camera?.object3D;
          const right = new THREE.Vector3(1, 0, 0);
          const up = new THREE.Vector3(0, 1, 0);
          if (cameraObject) {
            right.applyQuaternion(cameraObject.quaternion);
            up.applyQuaternion(cameraObject.quaternion);
          }
          const delta = right.multiplyScalar(dx / pixelsPerWorldUnit)
            .add(up.multiplyScalar(-dy / pixelsPerWorldUnit));
          frozenState.position = {
            x: frozenState.position.x + delta.x,
            y: frozenState.position.y + delta.y,
            z: frozenState.position.z + delta.z,
          };
          applyFrozenState();
          return cloneFrozenState();
        };

        const rotateFrozenBy = ({ yawDelta = 0 } = {}) => {
          if (!frozenState.active) return cloneFrozenState();
          const nextYaw = ((frozenState.rotation.y + Number(yawDelta || 0)) % 360 + 360) % 360;
          frozenState.rotation = { ...frozenState.rotation, y: nextYaw };
          applyFrozenState();
          return cloneFrozenState();
        };

        const playTargetMedia = (target) => {
          const ar = target?.ar;
          if (ar?.type !== 'video' || !ar.assetId) return;
          const video = findSceneAssetById(scene, ar.assetId);
          video?.play?.().catch(() => {});
        };

        const pauseTargetMedia = (target) => {
          const ar = target?.ar;
          if (ar?.type !== 'video' || !ar.assetId) return;
          const video = findSceneAssetById(scene, ar.assetId);
          video?.pause?.();
        };

        const onFound = (target) => {
          const payload = cloneTarget(target);
          activeTargets.set(target.targetIndex, payload);
          lastTarget = payload;
          playTargetMedia(target);
          setStatus('found');
          foundCbs.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
        };
        const onLost = (target) => {
          const payload = cloneTarget(target);
          activeTargets.delete(target.targetIndex);
          pauseTargetMedia(target);
          setStatus(activeTargets.size > 0 ? 'found' : (startedRef.current ? 'lost' : 'ready'));
          lostCbs.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
        };

        anchors.forEach((anchor) => {
          anchor.onFound = () => onFound(anchor.target);
          anchor.onLost = () => onLost(anchor.target);
          anchor.element.addEventListener('targetFound', anchor.onFound);
          anchor.element.addEventListener('targetLost', anchor.onLost);
        });

        scene.addEventListener('loaded', () => {
          if (!startedRef.current && statusRef.current === 'idle') setStatus('ready');
        }, { once: true });

        const getCameraTrack = () => {
          const videos = Array.from(container.querySelectorAll('video'));
          const video = videos.find((v) => v.srcObject && v.srcObject.getVideoTracks);
          return video?.srcObject?.getVideoTracks?.()[0] || null;
        };

        window.__mindar = {
          scene,
          anchors: anchors.map(({ element }) => element),
          targets: MINDAR_TARGETS.map(cloneTarget),
          getStatus: () => statusRef.current,
          getActiveTargets: () => Array.from(activeTargets.values()).map(cloneTarget),
          getLastTarget: () => lastTarget ? cloneTarget(lastTarget) : null,
          freezeCurrentTarget,
          unfreezeCurrentTarget,
          setFrozenTransform,
          getFrozenState: cloneFrozenState,
          moveFrozenByScreenDelta,
          rotateFrozenBy,
          rotateLiveBy,
          getLiveYaw,
          isReady: () => scene.hasLoaded === true,
          onStatus: (cb) => {
            statusCbs.add(cb);
            cb(statusRef.current);
            return () => statusCbs.delete(cb);
          },
          start: async () => {
            const sys = scene.systems && scene.systems['mindar-image-system'];
            if (!sys) throw new Error('mindar-image-system not ready');
            setStatus('loading');
            if (navigator.mediaDevices?.getUserMedia) {
              let probeStream = null;
              try {
                probeStream = await navigator.mediaDevices.getUserMedia({
                  video: { facingMode: { ideal: 'environment' } },
                  audio: false,
                });
              } catch (err) {
                setStatus('camera-denied');
                throw err;
              } finally {
                probeStream?.getTracks?.().forEach((track) => track.stop());
              }
            }
            await sys.start();
            startedRef.current = true;
            setStatus('running');
          },
          stop: () => {
            const sys = scene.systems && scene.systems['mindar-image-system'];
            if (sys) sys.stop();
            startedRef.current = false;
            activeTargets.clear();
            MINDAR_TARGETS.forEach(pauseTargetMedia);
            unfreezeCurrentTarget();
            setStatus(scene.hasLoaded ? 'ready' : 'idle');
          },
          onTargetFound: (cb) => { foundCbs.add(cb); return () => foundCbs.delete(cb); },
          onTargetLost:  (cb) => { lostCbs.add(cb);  return () => lostCbs.delete(cb); },
          focusCamera: async () => {
            const track = getCameraTrack();
            if (!track?.applyConstraints) return false;
            try {
              await track.applyConstraints({
                advanced: [
                  { focusMode: 'continuous' },
                  { exposureMode: 'continuous' },
                  { whiteBalanceMode: 'continuous' },
                ],
              });
              return true;
            } catch {
              try {
                const zoom = track.getSettings?.().zoom;
                if (Number.isFinite(zoom)) {
                  await track.applyConstraints({ advanced: [{ zoom }] });
                  return true;
                }
              } catch {}
              return false;
            }
          },
        };

        return () => {
          try {
            const sys = scene.systems && scene.systems['mindar-image-system'];
            if (sys && startedRef.current) sys.stop();
          } catch {}
          anchors.forEach((anchor) => {
            anchor.element.removeEventListener('targetFound', anchor.onFound);
            anchor.element.removeEventListener('targetLost', anchor.onLost);
          });
          activeTargets.clear();
          setStatus('idle');
          if (window.__mindar && window.__mindar.scene === scene) delete window.__mindar;
          container.innerHTML = '';
          sceneRef.current = null;
          anchorsRef.current = [];
          startedRef.current = false;
        };
      }, []);

      // Start/stop the camera session as the app flows through scan/ar vs. other screens.
      React.useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        const startIfNeeded = async () => {
          if (startedRef.current) return;
          try {
            // A-Frame may still be bootstrapping; wait for scene load if needed.
            if (!scene.hasLoaded) {
              await new Promise((resolve) => scene.addEventListener('loaded', resolve, { once: true }));
            }
            const sys = scene.systems && scene.systems['mindar-image-system'];
            if (!sys) throw new Error('mindar-image-system missing');
            await window.__mindar.start();
          } catch (err) {
            console.error('[MindAR] start failed', err);
            const message = String(err?.name || err?.message || err);
            if (/NotAllowed|Permission|denied/i.test(message)) {
              window.__setProtoState?.('denied');
            } else {
              window.__setProtoState?.('error');
            }
          }
        };

        const stopIfNeeded = () => {
          if (!startedRef.current) return;
          window.__mindar?.stop();
        };

        if (active) startIfNeeded();
        else stopIfNeeded();
      }, [active]);

      return (
        <div
          ref={containerRef}
          aria-hidden="true"
          style={{
            position: 'absolute',
            inset: 0,
            overflow: 'hidden',
            // MindAR video fills the scene; we clip to the phone frame.
            visibility: visible ? 'visible' : 'hidden',
            zIndex: 0,
          }}
        />
      );
    }

    function ScreenFor({ state, lang, setLang }) {
      switch (state) {
        case 'qr':         return <ScreenQR lang={lang} setLang={setLang}/>;
        case 'landing':    return <ScreenLanding lang={lang} setLang={setLang}/>;
        case 'permission': return <ScreenPermission lang={lang} setLang={setLang}/>;
        case 'loading':    return <ScreenLoading lang={lang} setLang={setLang}/>;
        case 'scan':       return <ScreenScan lang={lang} setLang={setLang}/>;
        case 'ar':         return <ScreenARActive lang={lang} setLang={setLang}/>;
        case 'denied':     return <ScreenDenied lang={lang} setLang={setLang}/>;
        case 'error':      return <ScreenError lang={lang} setLang={setLang}/>;
        default:           return <ScreenLanding lang={lang} setLang={setLang}/>;
      }
    }

    function App() {
      // Persist position so refresh doesn't boot user back to start
      const [state, setStateRaw] = React.useState(() => {
        try {
          const savedState = localStorage.getItem('emo_proto_state');
          return STATES.some((st) => st.key === savedState) ? savedState : 'landing';
        } catch { return 'landing'; }
      });
      const [lang, setLangRaw] = React.useState(() => {
        try { return localStorage.getItem('emo_proto_lang') || 'zh'; } catch { return 'zh'; }
      });
      const [debug, setDebug] = React.useState(false);
      const [nonce, setNonce] = React.useState(0);  // bump to retrigger enter animation

      const setState = React.useCallback((s) => {
        setStateRaw(s);
        setNonce(n => n + 1);
        try { localStorage.setItem('emo_proto_state', s); } catch {}
      }, []);

      const setLang = React.useCallback((nextLang) => {
        setLangRaw(nextLang);
        try { localStorage.setItem('emo_proto_lang', nextLang); } catch {}
      }, []);

      React.useEffect(() => {
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh';
      }, [lang]);

      React.useEffect(() => {
        window.__setProtoState = setState;
        return () => {
          if (window.__setProtoState === setState) delete window.__setProtoState;
        };
      }, [setState]);

      // Auto-advance on loading state
      React.useEffect(() => {
        if (state === 'loading') {
          window.Step06Assets?.preload({ full: false });
          const t = setTimeout(() => setState('scan'), 2200);
          return () => clearTimeout(t);
        }
      }, [state, setState]);

      React.useEffect(() => {
        if (state === 'scan' || state === 'ar') {
          window.Step06Assets?.preload({ full: false });
          window.Step06Assets?.preloadUrls?.(window.EMO_INTRO_FRAME_URLS || []);
        }
        window.EMOARAudio?.preload?.();
        if (state === 'scan') {
          window.EMOARAudio?.startScan?.();
        } else if (state === 'ar') {
          window.EMOARAudio?.cueARIntro?.();
        } else {
          window.EMOARAudio?.stop?.();
        }
      }, [state]);

      // Keyboard: arrow keys step through the main happy path for quick review
      React.useEffect(() => {
        const HAPPY_PATH = ['landing','permission','loading','scan','ar'];
        const onKey = (e) => {
          if (e.key === 'ArrowRight') {
            const i = HAPPY_PATH.indexOf(state);
            if (i >= 0 && i < HAPPY_PATH.length - 1) setState(HAPPY_PATH[i + 1]);
          } else if (e.key === 'ArrowLeft') {
            const i = HAPPY_PATH.indexOf(state);
            if (i > 0) setState(HAPPY_PATH[i - 1]);
          } else if (e.key.toLowerCase() === 'd') {
            setDebug(d => !d);
          } else if (e.key.toLowerCase() === 'r') {
            setState('landing');
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [state, setState]);

      return (
        <div style={{ position: 'fixed', inset: 0, overflow: 'hidden', background: '#000' }}>
          {/* Persistent MindAR camera + anchor. Mounted once, survives screen switches. */}
          <MindARStage
            active={state === 'scan' || state === 'ar'}
            visible={state === 'scan' || state === 'ar'}
          />
          {/* Re-key on nonce so entry animation plays on every transition */}
          <div key={nonce} className="screen-container screen-enter" style={{ position: 'absolute', inset: 0, zIndex: 1 }}>
            <ScreenFor state={state} lang={lang} setLang={setLang}/>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
<!-- redeploy trigger -->
</html>
