<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>一毛 AR · EMO AR Campaign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Gantari:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    html, body { margin: 0; padding: 0; background: #FAF6F1; font-family: 'Gantari', system-ui; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }

    @keyframes mascot-bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-8px) rotate(1deg); }
    }
    .mascot-bob { animation: mascot-bob 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes mascot-pop {
      0% { transform: scale(0.2) translateY(30px); opacity: 0; }
      60% { transform: scale(1.08) translateY(-4px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes mascot-appear {
      0% { transform: translateX(-50%) scale(0.3) translateY(40px); opacity: 0; }
      60% { transform: translateX(-50%) scale(1.08) translateY(-6px); opacity: 1; }
      100% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
    }
    @keyframes scan-sweep {
      0% { top: 10%; opacity: 0; }
      10%, 90% { opacity: 1; }
      50% { top: 90%; }
      100% { top: 10%; opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }
    /* appear-seq cycles 4 keyframe PNGs to mimic the sprout/grow sequence */
    @keyframes appear-seq {
      0%     { opacity: 0; transform: scale(0.85); }
      6%     { opacity: 1; transform: scale(1); }
      22%    { opacity: 1; transform: scale(1); }
      28%    { opacity: 0; transform: scale(1); }
      100%   { opacity: 0; transform: scale(1); }
    }
    /* Sprout grow — 24-frame horizontal sprite sheet animated via background-position.
       steps(23) over ~55% of the cycle = smooth stop-motion, then hold. */
    .sprout-sprite {
      animation: sprout-grow 3.8s steps(23, end) infinite;
    }
    @keyframes sprout-grow {
      0%   { background-position-x: 0; }
      55%  { background-position-x: var(--frameShift); }
      100% { background-position-x: var(--frameShift); }
    }
    /* gentle float on the whole sprite group */
    @keyframes sprout-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .sprout-sprite-wrap { animation: sprout-bob 3.2s ease-in-out infinite; }
    /* orbiting caption text — mimics the reference video's circular text around head */
    @keyframes orbit-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes face-bob {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-10px) rotate(1.5deg); }
    }
    /* orbiting caption text — mimics the reference video's circular text around head */
    @keyframes orbit-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes face-bob {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-10px) rotate(1.5deg); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="mascot.jsx"></script>
  <script type="text/babel" src="screens-a.jsx"></script>
  <script type="text/babel" src="screens-b.jsx"></script>

  <script type="text/babel">
    const FRAME_W = 390;
    const FRAME_H = 820;

    function Phone({ children }) {
      return (
        <IOSDevice width={FRAME_W} height={FRAME_H}>
          {children}
        </IOSDevice>
      );
    }

    function App() {
      return (
        <div data-screen-label="AR Campaign Canvas">
          <DesignCanvas>
            <DCSection id="flow" title="一毛 AR · User Flow" subtitle="Scan QR → Web → Camera → AR · bilingual 中/EN · matches reference video">
              <DCArtboard id="qr" label="01 · QR Entry  扫码入口" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenQR/></Phone></div>
              </DCArtboard>

              <DCArtboard id="landing" label="02 · Landing  着陆页" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenLanding/></Phone></div>
              </DCArtboard>

              <DCArtboard id="permission" label="03 · Permission  相机授权" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenPermission/></Phone></div>
              </DCArtboard>

              <DCArtboard id="loading" label="04 · Loading  加载中" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenLoading/></Phone></div>
              </DCArtboard>

              <DCArtboard id="scan" label="05 · Scan  扫描" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenScan/></Phone></div>
              </DCArtboard>

              <DCArtboard id="ar" label="06 · AR Active  AR 激活 · 一毛出现" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenARActive/></Phone></div>
              </DCArtboard>

              <DCArtboard id="denied" label="07 · Denied  权限被拒" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenDenied/></Phone></div>
              </DCArtboard>

              <DCArtboard id="error" label="08 · Error  错误" width={FRAME_W + 20} height={FRAME_H + 20}>
                <div style={{ padding: 10 }}><Phone><ScreenError/></Phone></div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
