services:
  postgres:
    image: postgres:16-alpine
    container_name: emo-ar-postgres
    environment:
      POSTGRES_DB: emo_ar
      POSTGRES_USER: emo
      POSTGRES_PASSWORD: emo
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - emo-ar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emo -d emo_ar"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  emo-ar-postgres:
